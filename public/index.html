<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYMA Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" id="mainNav" style="display:none">
    <div class="container-fluid">
      <a class="navbar-brand" href="#/"><i class="bi bi-graph-up-arrow"></i> BYMA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="#/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="#/tickers"><i class="bi bi-search"></i> Tickers</a></li>
          <li class="nav-item"><a class="nav-link" href="#/watchlist"><i class="bi bi-eye"></i> Watchlist</a></li>
          <li class="nav-item"><a class="nav-link" href="#/portfolio"><i class="bi bi-wallet2"></i> Portfolio</a></li>
          <li class="nav-item"><a class="nav-link" href="#/analysis"><i class="bi bi-bar-chart"></i> Analisis</a></li>
          <li class="nav-item"><a class="nav-link" href="#/ai"><i class="bi bi-robot"></i> IA</a></li>
          <li class="nav-item"><a class="nav-link" href="#/telegram"><i class="bi bi-telegram"></i> Telegram</a></li>
          <li class="nav-item" id="adminNavItem" style="display:none"><a class="nav-link" href="#/admin"><i class="bi bi-shield-lock"></i> Admin</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle"></i> <span id="userName"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#" id="changePasswordBtn"><i class="bi bi-key"></i> Cambiar Clave</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesion</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-3" id="mainContent">
    <div id="loadingSpinner" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>
    <div id="pageContent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/tickers.js"></script>
  <script src="js/pages/watchlist.js"></script>
  <script src="js/pages/portfolio.js"></script>
  <script src="js/pages/analysis.js"></script>
  <script src="js/pages/ai.js"></script>
  <script src="js/pages/telegram.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
